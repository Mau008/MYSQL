version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: santo_pecado_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mi_base_de_datos
      MYSQL_USER: mauro
      MYSQL_PASSWORD: siglo21
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
